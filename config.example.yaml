sip:
  udp_addr: "0.0.0.0:5060"
  tcp_addr: "0.0.0.0:5060"
  # tls_addr: "0.0.0.0:5061"
  # tls_cert: "certs/cert.pem"
  # tls_key:  "certs/key.pem"
  external_ip: "" # YOUR_PUBLIC_IP
  external_sip_port: 5060
  external_sip_transport: "udp"
  user_agent: "Sentry/1.0"
  log_sip: false
  tls_insecure_skip_verify: false

api:
  addr: "0.0.0.0:8080"
  # tls_cert: "certs/api-cert.pem"
  # tls_key:  "certs/api-key.pem"
  jwt_secret: "CHANGE_ME_FOR_DASHBOARD"

admin:
  bootstrap_users:
    - username: "admin"
      password: "password"

database:
  driver: "postgres"
  dsn: "postgres://user:password@localhost:5432/sentry?sslmode=disable"

push:
  fcm_service_account: "" # Path to Firebase JSON key
  apns_cert: "" # Path to APNs .p12 or .pem
  apns_key_id: ""
  apns_team_id: ""
  apns_bundle_id: ""
  apns_production: false

pprof:
  addr: ""

ratelimit:
  register_rate: 0.5   # requests per second per IP (0.5 = 30/min)
  register_burst: 5    # burst capacity

# Upstream registration health and self-healing. Probes are shared by every
# extension using the same host, port, and transport.
registrar:
  expires_seconds: 600
  refresh_percent: 70
  attempt_timeout_seconds: 8
  probe_enabled: true
  probe_interval_milliseconds: 3000
  probe_timeout_milliseconds: 1200
  probe_failure_threshold: 2
  down_probe_interval_milliseconds: 1000
  register_canary_interval_milliseconds: 10000
  probe_global_workers: 128
  probe_global_max_rate: 1000
  recovery_workers_per_gateway: 64
  recovery_initial_rate: 25
  recovery_max_rate: 500
  recovery_global_workers: 512
  recovery_global_max_rate: 1000

log:
  level: "info"
